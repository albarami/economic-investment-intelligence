[project]
name = "eii-product"
version = "0.0.0"
description = "Serving plane of the EII working-title project (package skeleton only)."
requires-python = ">=3.14"
dependencies = ["eii-core", "fastapi==0.162.5", "uvicorn==0.54.0", "pyvalhalla==3.9.1", "pyyaml==6.0.3", "pydantic==2.14.3", "duckdb==2.0.0", "psycopg[binary]==3.3.8", "sqlglot==30.31.0", "shapely==2.2.0"]

[tool.uv.sources]
eii-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11.31,<0.12"]
build-backend = "uv_build"
