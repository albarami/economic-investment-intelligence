[project]
name = "eii-workspace"
version = "0.0.0"
description = "Root of the uv workspace for the four EII Python packages."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "fastapi==0.162.5",
  "hypothesis==6.170.15",
  "mypy==2.4.1",
  "pre-commit==4.7.0",
  "pytest==9.2.0",
  "ruff==0.17.4",
  "uvicorn==0.54.0",
]
engine = [
  "duckdb==2.0.0",
  "h3==4.5.0",
  "psycopg[binary]==3.3.8",
  "pyvalhalla==3.9.1",
  "shapely==2.2.0",
]

[tool.uv]
package = false
required-version = "==0.11.31"

[tool.uv.workspace]
members = ["core", "custodian", "gateway", "product"]

[tool.ruff]
target-version = "py312"
src = ["scripts", "core/src", "custodian/src", "product/src", "gateway/src"]
extend-exclude = ["*.md"]
fix = false

[tool.ruff.lint]
select = ["E4", "E7", "F", "B", "I", "UP", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = "scripts,core/src,custodian/src,product/src,gateway/src"
mypy_path = "$MYPY_CONFIG_FILE_DIR/scripts:$MYPY_CONFIG_FILE_DIR/core/src:$MYPY_CONFIG_FILE_DIR/custodian/src:$MYPY_CONFIG_FILE_DIR/product/src:$MYPY_CONFIG_FILE_DIR/gateway/src"

[[tool.mypy.overrides]]
module = ["valhalla", "valhalla.*"]
follow_untyped_imports = true

[tool.pytest]
strict = true
addopts = [
  "--import-mode=importlib",
  "--hypothesis-profile=eii",
  "-p",
  "no:cacheprovider",
  "-m",
  "not nightly",
]
pythonpath = [
  "scripts",
  "scripts/tests",
  "core/src",
  "custodian/src",
  "product/src",
  "gateway/src",
]
markers = [
  "postgres: needs a reachable PostgreSQL; with none it is skipped with the reason OI-10",
  "sandbox: needs bubblewrap; it is never skipped",
  "nightly: not part of the pull-request run",
  "live_model: needs a live model key; with none it is skipped with the reason OI-01",
]
