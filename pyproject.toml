[project]
name = "eii-workspace"
version = "0.0.0"
description = "Root of the uv workspace for the three EII Python packages (scaffolding only)."
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "hypothesis==6.170.15",
  "mypy==2.4.1",
  "pytest==9.2.0",
  "ruff==0.17.4",
]

[tool.uv]
package = false
required-version = "==0.11.31"

[tool.uv.workspace]
members = ["core", "custodian", "product"]

[tool.ruff]
target-version = "py312"
src = ["scripts", "core/src", "custodian/src", "product/src"]
extend-exclude = ["*.md"]
fix = false

[tool.ruff.lint]
select = ["E4", "E7", "F", "B", "I", "UP", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
files = "scripts,core/src,custodian/src,product/src"
mypy_path = "$MYPY_CONFIG_FILE_DIR/scripts:$MYPY_CONFIG_FILE_DIR/core/src:$MYPY_CONFIG_FILE_DIR/custodian/src:$MYPY_CONFIG_FILE_DIR/product/src"

[tool.pytest]
strict = true
addopts = [
  "--import-mode=importlib",
  "--hypothesis-profile=eii",
  "-p",
  "no:cacheprovider",
  "-m",
  "not nightly",
]
pythonpath = [
  "scripts",
  "scripts/tests",
  "core/src",
  "custodian/src",
  "product/src",
]
markers = [
  "postgres: needs a reachable PostgreSQL; with none it is skipped with the reason OI-10",
  "sandbox: needs bubblewrap; it is never skipped",
  "nightly: not part of the pull-request run",
  "live_model: needs a live model key; with none it is skipped with the reason OI-01",
]
