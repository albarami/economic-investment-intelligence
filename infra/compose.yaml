# Database service of option C (docs/13_DEPLOYMENT_AND_OPERATIONS.md, section 4.3).
# Image: postgis/postgis on the PostgreSQL 18 with PostGIS 3.6 line, pinned by the image index
# digest that the registry gave for the tag 18-3.6 on 2026-11-12 (PostgreSQL 18.6, PostGIS 3.6.4,
# platform linux/amd64 only); slice S1 confirms it.
# ./eii db-up derives the host port from EII_DATABASE_URL and passes it as EII_COMPOSE_DB_PORT in a
# generated file; no host port and no secret value is written here.
name: eii-poc
services:
  db:
    image: postgis/postgis@sha256:4a43e3c3e5d55b9208240fc71db543b79c638766280c625a425bd0a2390989c4
    pull_policy: never
    ports:
      - "127.0.0.1:${EII_COMPOSE_DB_PORT:?required, derived from EII_DATABASE_URL}:5432"
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_superuser_password
    secrets:
      - postgres_superuser_password
    volumes:
      - eii_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "5432"]
      interval: 2s
      retries: 30
volumes:
  eii_pgdata:
secrets:
  postgres_superuser_password:
    file: ../data/compose/postgres_superuser_password
