  - key: property_prices_quarterly
    state: open
    source_keys: [prop_sales, prop_resi_units/weekly-residential-units-sales-bulletin]
    table: pub_property_quarter
    period: "2020-Q3/2025-Q4"
    frequency: quarter
    subject: district
    reason: awaiting_reviewed_use_map_and_district_crosswalk
    note: "Card C41: median per square foot by district and use, with each quarter's deal count; separate from annual medians per square metre. The window is the trailing run of quarters with a kept deal: a quarter with no kept deal has no value and quarters before it are not used; the first real fetch re-checks contiguity and the kept-deal count before the entry may hold. Public district label with municipality only, never apportioned."
    evidence: "TASKS.md S2-T17 amendment; document 04 PUB-103 and PUB-107 and section 2.2 coverage; document 03 DAT-167; document 07 C30 and C41; join ruling J27."
