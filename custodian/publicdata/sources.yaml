forecast_series:
  - key: licence_issues
    state: held
    source_keys: [lic_issued]
    table: pub_licence_issued
    period: "2013-04/2025-05"
    frequency: month
    past_count: 146
    subject: ""
    reason: ""
    note: "Licence issues by activity and municipality, only covered codes; earlier, broken months exist from 2009-09. Undated rows never enter; continuity at each activity and municipality remains for C30."
    evidence: "Lead source reading 2026-11-14 Q1; document 04 PUB-103 and section 2.2; document 07 C30."
  - key: licence_cancellations
    state: held
    source_keys: [lic_cancelled]
    table: pub_licence_cancelled
    period: "2016-03/2025-05"
    frequency: month
    past_count: 111
    subject: ""
    reason: ""
    note: "Licence cancellations by activity and municipality; earlier, broken months exist from 2015-12. Exclude 1,221 undated rows; retain bulk-month flags. Continuity at each activity and municipality remains for C30."
    evidence: "Lead source reading 2026-11-14 Q2; document 04 PUB-68 and PUB-103; document 07 C30."
  - key: property_prices
    state: held
    source_keys: [prop_sales]
    table: pub_property_sale
    period: "2020/2025"
    frequency: year
    past_count: 6
    subject: district
    reason: ""
    note: "Six years with data; five complete years (2021 to 2025); 2020 holds July to December only. C30 decides which history counts at each district; no completeness rule added here. Annual medians per square metre with deal counts; never joined to quarterly per-square-foot prices. District is the publisher label with municipality, Public only, never apportioned or an area subject (lead assumption)."
    evidence: "Lead source reading 2026-11-14 Q5 and ruling L5; document 04 PUB-103; document 07 C14 and C30."
  - key: hotel_demand_and_room_rates
    state: held
    source_keys: [hotel_segment]
    table: pub_hotel_monthly
    period: "2014-01/2025-03"
    frequency: month
    past_count: 135
    subject: ""
    reason: ""
    note: "One entry because demand and average_daily_rate share every month of every segment; separate demand and adr indicators each retain their own published unit in pub_hotel_monthly (document 03 section 7.2). No measure is derived from the other; units are not inferred here."
    evidence: "Lead source reading 2026-11-14 Q3; document 04 PUB-103 and section 2.2."
  - key: consumer_prices
    state: open
