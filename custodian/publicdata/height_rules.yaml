# S2-T20 — height rules of the PUB-106 order (decision 0023 item A2, card C47).
# storey_height_m is the only place the storey number lives: quoted text parsed
# to Decimal, labelled ASSUMPTION and to be replaced by the owner.
storey_height_m:
  value: "3.0"
  label: "ASSUMPTION"
  basis: "The lead's stated assumption of 2026-11-14, to be replaced by the owner; the measured error of the floor-count fallback is shown beside it in the asset manifest."
order: "the recorded height; the floor count times the stated storey height; the open 3D-GloBFP height; the WSF 3D 90 m cell mean; none when the order is exhausted"
match_3dglobfp: "the 3D-GloBFP footprints that contain the building's representative point; the one with the largest overlap area against the building footprint wins; a residual tie takes the lowest file name in sorted order, then the lowest row index within its file"
match_wsf3d: "the WSF 3D cell that contains the representative point; the stored value times the declared scale is the height in metres; a no-data cell or a point outside the raster gives no value"
credit_3dglobfp: "Building heights: 3D-GloBFP, Che et al. 2024, CC BY 4.0, retrieved {date}. Heights are estimates."
sources:
  bldg_3dglobfp:
    format: "shapefile_zip"
    field: "Height"
    class_field: ""
    unit: "m"
    nodata: ""
    crs: "EPSG:4326"
  bldg_wsf3d:
    format: "GTiff"
    band: "1"
    unit: "m"
    nodata: "-32767"
    scale: "0.1"
    crs: "EPSG:4326"
    dtype: "int16"
    class_field: ""
  bldg_gba:
    format: "to be confirmed"
    field: "to be confirmed"
    class_field: "to be confirmed"
    unit: "m"
    nodata: ""
    crs: "EPSG:4326"
