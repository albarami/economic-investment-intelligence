# Kept fields of the GIS centre layers fetched by S2-T19.
# Names, field types, layer ids and page limits are the service's own,
# from the live reading of 2026-11-15. The fetcher pages at the
# maxRecordCount of each layer answer. page_limit records that reading.
sources:
  gis_land_price:
    layers:
      - service_path: /server/rest/services/Vector/LandPricing2026/MapServer
        layer_id: 0
        layer_name: Qatar_District_Land_Pricing
        geometry: polygon
        page_limit: 2000
        fields:
          - {name: DIST_NO, esri_type: esriFieldTypeInteger}
          - {name: District_No, esri_type: esriFieldTypeInteger}
          - {name: ANAME, esri_type: esriFieldTypeString}
          - {name: ENAME, esri_type: esriFieldTypeString}
          - {name: ResidentialPrices, esri_type: esriFieldTypeString}
          - {name: ResidentialCityCenter, esri_type: esriFieldTypeString}
          - {name: ResidentialPriceFlats, esri_type: esriFieldTypeString}
          - {name: ResidentialPriceVillas, esri_type: esriFieldTypeString}
          - {name: CommercialPrices, esri_type: esriFieldTypeString}
          - {name: Shape, esri_type: esriFieldTypeGeometry}
  gis_rail:
    layers:
      - service_path: /server/rest/services/Vector/QRAIL_NO_OPERATION/MapServer
        layer_id: 2
        layer_name: QRAIL.Metro_Stations
        geometry: point
        page_limit: 2000
        fields:
          - {name: STATION_NAME_ENGLISH, esri_type: esriFieldTypeString}
          - {name: STATION_NAME_ARABIC, esri_type: esriFieldTypeString}
          - {name: PHASE, esri_type: esriFieldTypeString}
          - {name: LINE, esri_type: esriFieldTypeString}
          - {name: RED_LINE_PHASE, esri_type: esriFieldTypeString}
          - {name: GREEN_LINE_PHASE, esri_type: esriFieldTypeString}
          - {name: GOLD_LINE_PHASE, esri_type: esriFieldTypeString}
          - {name: BLUE_LINE_PHASE, esri_type: esriFieldTypeString}
          - {name: BLACK_LINE_PHASE, esri_type: esriFieldTypeString}
          - {name: SHAPE, esri_type: esriFieldTypeGeometry}
      - service_path: /server/rest/services/Vector/QRAIL_NO_OPERATION/MapServer
        layer_id: 0
        layer_name: QRAIL.Metro_Tracks_Detailed
        geometry: line
        page_limit: 2000
        fields:
          - {name: TRACK_NAME, esri_type: esriFieldTypeString}
          - {name: LINE, esri_type: esriFieldTypeSmallInteger}
          - {name: PHASE, esri_type: esriFieldTypeString}
          - {name: RED_LINE_PHASE, esri_type: esriFieldTypeString}
          - {name: GREEN_LINE_PHASE, esri_type: esriFieldTypeString}
          - {name: GOLD_LINE_PHASE, esri_type: esriFieldTypeString}
          - {name: BLUE_LINE_PHASE, esri_type: esriFieldTypeString}
          - {name: BLACK_LINE_PHASE, esri_type: esriFieldTypeString}
          - {name: SHAPE, esri_type: esriFieldTypeGeometry}
          - {name: SHAPE.LEN, esri_type: esriFieldTypeDouble}
      - service_path: /server/rest/services/Vector/QRAIL_NO_OPERATION/MapServer
        layer_id: 1
        layer_name: QRAIL.Rail_Protection_Zones
        geometry: polygon
        page_limit: 2000
        fields:
          - {name: PHASE, esri_type: esriFieldTypeString}
          - {name: SHAPE, esri_type: esriFieldTypeGeometry}
          - {name: SHAPE.AREA, esri_type: esriFieldTypeDouble}
          - {name: SHAPE.LEN, esri_type: esriFieldTypeDouble}
