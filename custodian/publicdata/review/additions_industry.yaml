schemas:
  a1:
    layout: licence
    licence_field: license_type
    licence_ar: nw_ltrkhys
    licence_types:
      - "Industrial License"
      - "Industrial Registration"
    fields:
      - year
      - license_type
      - nw_ltrkhys
      - number_of_firms
      - investment_million_qatari_riyals
      - number_of_labour
    measures:
      - field: number_of_firms
        indicator: firms
        integral: true
        unit: to_be_confirmed
      - field: investment_million_qatari_riyals
        indicator: investment
        integral: false
        unit: qar_million
      - field: number_of_labour
        indicator: labour
        integral: true
        unit: to_be_confirmed
  a2:
    layout: licence
    licence_field: license_type
    licence_ar: nw_ltrkhys
    licence_types:
      - "Industrial License"
      - "Industrial Registration"
    fields:
      - year
      - license_type
      - nw_ltrkhys
      - number_of_firms
      - investment_in_million_qatari_riyals
      - number_of_labour
    measures:
      - field: number_of_firms
        indicator: firms
        integral: true
        unit: to_be_confirmed
      - field: investment_in_million_qatari_riyals
        indicator: investment
        integral: false
        unit: qar_million
      - field: number_of_labour
        indicator: labour
        integral: true
        unit: to_be_confirmed
  b:
    layout: licence
    licence_field: license_type
    licence_types:
      - "Industrial License"
      - "Industrial Registration"
    fields:
      - year
      - license_type
      - no_of_firms
      - investment_qar_mil
      - no_of_labour
    measures:
      - field: no_of_firms
        indicator: firms
        integral: true
        unit: to_be_confirmed
      - field: investment_qar_mil
        indicator: investment
        integral: false
        unit: qar_million
      - field: no_of_labour
        indicator: labour
        integral: true
        unit: to_be_confirmed
