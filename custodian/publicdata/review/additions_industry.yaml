# Reviewed field map for establishment size, manufacturing, wholesale and retail
# trade, and trade logistics. Labels are the inventory's own. Nothing is renamed
# across bulletins. The country crosswalk holds reviewed rows: one exact published
# label (no trimming, no case change) to one ISO 3166-1 alpha-3 code. Its cited
# reference is the ISO 3166-1 standard (country codes, alpha-3), as listed in
# country_iso3.csv. A label that is not exactly one country has no row and stops
# the build until the lead rules it; a listed region is skipped and counted.
version: 1
country_crosswalk:
