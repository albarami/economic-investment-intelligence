# Reviewed field map for establishment size, manufacturing, wholesale and retail
# trade, and trade logistics. Labels are the inventory's own. Nothing is renamed
# across bulletins. The country crosswalk has no rows: the lead adds exact labels.
version: 1
country_crosswalk: []
regions_not_countries:
  - "African Countries"
  - "Asian Countries"
  - "Central American & Caribbean Countries"
  - "European Countries"
  - "G.C.C Countries"
  - "North American Countries"
  - "Ocean Countries"
  - "Other Arab Countries"
  - "Other Countries"
  - "South American Countries"
certificate_types_unpublished:
  - "#N/A"
certificate_types:
  - "Arab Certificate of Origin"
  - "Certificate of Origin under Preferential System"
  - "Certificates of Origin"
  - "Free Zones Certificate of Origin"
  - "GCC Certificates"
  - "Unified GCC Certificate of Origin with EFTA Countries"
  - "Unified GCC Certificate of Origin with Singapore"
vessel_types:
  - "Auto Carrier"
  - "Bulk"
  - "Containers"
  - "Gas Tanker"
  - "General Cargo"
  - "Live Stock"
  - "Oil Tanker"
  - "Other"
  - "Passengers Carrier"
schemas:
  a1:
    layout: licence
    licence_field: license_type
    licence_ar: nw_ltrkhys
    licence_types:
      - "Industrial License"
      - "Industrial Registration"
    fields:
      - year
      - license_type
      - nw_ltrkhys
      - number_of_firms
      - investment_million_qatari_riyals
      - number_of_labour
    measures:
      - field: number_of_firms
        indicator: firms
        integral: true
        unit: to_be_confirmed
      - field: investment_million_qatari_riyals
        indicator: investment
        integral: false
        unit: qar_million
      - field: number_of_labour
        indicator: labour
        integral: true
        unit: to_be_confirmed
  a2:
    layout: licence
    licence_field: license_type
    licence_ar: nw_ltrkhys
    licence_types:
      - "Industrial License"
      - "Industrial Registration"
    fields:
      - year
      - license_type
      - nw_ltrkhys
      - number_of_firms
      - investment_in_million_qatari_riyals
      - number_of_labour
    measures:
      - field: number_of_firms
        indicator: firms
        integral: true
        unit: to_be_confirmed
      - field: investment_in_million_qatari_riyals
        indicator: investment
        integral: false
        unit: qar_million
      - field: number_of_labour
        indicator: labour
        integral: true
        unit: to_be_confirmed
  b:
    layout: licence
    licence_field: license_type
    licence_types:
      - "Industrial License"
      - "Industrial Registration"
    fields:
      - year
      - license_type
      - no_of_firms
      - investment_qar_mil
      - no_of_labour
    measures:
      - field: no_of_firms
        indicator: firms
        integral: true
        unit: to_be_confirmed
      - field: investment_qar_mil
        indicator: investment
        integral: false
        unit: qar_million
      - field: no_of_labour
        indicator: labour
        integral: true
        unit: to_be_confirmed
s2_sizes: &s2_sizes
  - "Establishments with 10 Employees and More"
  - "Establishments with Less than 10 Employees"
s2_pairs: &s2_pairs
  "Establishments with 10 Employees and More": "المنشآت 10 مشتغلين فأكثر"
  "Establishments with Less than 10 Employees": "المنشآت أقل من 10 مشتغلين"
s2_indicators: &s2_indicators
  Employees: employees
  Establishments: establishments
s1_sizes: &s1_sizes
  - "10 Employees and more"
  - "Less than 10 Employees"
s1_pairs: &s1_pairs
  "10 Employees and more": "10 مشتغلين فأكثر"
  "Less than 10 Employees": "أقل من 10 مشتغلين"
s3_sizes: &s3_sizes
  - "Establishments with 10+ Employee"
  - "Establishments with <10 Employee"
slugs:
  number-of-establishments-and-employees-by-size-of-establishment-and-main-economic-activity-two:
