  number-of-establishments-and-employees-by-size-of-establishment-and-main-economic-activity-one:
    family: est_size_act
    layout: establishment
    activity_form: closed
    activity_codes: ["J", "K", "L", "M", "N"]
    size_field: size_of_establishment
    size_ar: hjm_lmnsh
    indicator_field: indicator
    indicator_ar: lbyn
    indicators: *s2_indicators
    size_classes: *s2_sizes
    size_pairs: *s2_pairs
    unit: to_be_confirmed
    fields: [year, activity_code, size_of_establishment, hjm_lmnsh, indicator, lbyn, value]
  establishments-employees-and-compensation-of-employees-by-economic-activity-business-services:
    family: est_size_act
    layout: establishment
    activity_form: two_digit
    indicator_field: indicator
