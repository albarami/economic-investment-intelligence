# Reviewed field map for the municipal families.
# Geography is the source's own municipality. Spellings resolve only through
# municipality_names.csv. Monthly files have no municipality field; published_names
# stays empty until the lead records the two spellings the lookup already holds.
version: 1
geography:
  "permits_muni/total-building-permits-issued-by-municipality-and-type-of-building-type-of-permit":
    grain: municipality
    name_fields: [municipality, lbldy]
  "permits_muni/total-building-completion-certificates-issued-by-municipality-and-type-of-building-type-of":
    grain: municipality
    name_fields: [municipality, lbldy]
  "permits_muni/building-permits-issued-by-type-of-permit-and-month-al-daayen-municipality":
    grain: municipality
    name_fields: []
    published_names: []
  "permits_muni/building-permits-issued-by-type-of-permit-and-month-al-khor-and-al-thakhira-municipality":
    grain: municipality
    name_fields: []
    published_names: []
  "permits_muni/building-permits-issued-by-type-of-permit-and-month-al-rayyan-municipality":
    grain: municipality
    name_fields: []
    published_names: []
  "permits_muni/building-permits-issued-by-type-of-permit-and-month-al-shahhaniya-municipality":
